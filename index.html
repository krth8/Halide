<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halide</title>
<meta name="description" content="Develop photos and video, and cut them into films — entirely in your browser.">
<link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<meta name="theme-color" content="#0a0910">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halide">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
</head>
<body>
<main class="launch">
  <header class="brandline">
    <span class="mark" id="mark"></span>
    <h1>HALIDE</h1>
    <p>Develop and edit — on any device.</p>
  </header>

  <nav class="modes hl-glass" aria-label="Workspaces">
    <a class="mode process" href="process/">
      <span class="glyph" id="gProcess"></span>
      <span class="txt">
        <b>Process</b>
        <small>Develop photos and video with film looks and colour.</small>
      </span>
      <span class="go" aria-hidden="true">→</span>
    </a>
    <span class="divider" aria-hidden="true"></span>
    <a class="mode edit" href="edit/">
      <span class="glyph" id="gEdit"></span>
      <span class="txt">
        <b>Edit</b>
        <small>Cut and grade video on a timeline.</small>
      </span>
      <span class="go" aria-hidden="true">→</span>
    </a>
  </nav>

  <section class="recent" id="recent" hidden>
    <div class="sec-head">
      <h2>Projects</h2>
      <div class="filter" id="filter" role="tablist">
        <button data-f="all" class="on">All</button><button data-f="process">Process</button><button data-f="edit">Edit</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="news" id="news"></section>

  <footer class="foot"><span id="foot"></span><button class="install" id="install" hidden>Install app</button></footer>
  <p class="ios-hint" id="iosHint" hidden>Install on iPhone: tap <b>Share</b> <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg> then <b>Add to Home Screen</b>.</p>
</main>
<script type="module" src="/src/launcher/main.ts"></script>
</body>
</html>
