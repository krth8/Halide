<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halide Process</title>
  <meta name="description" content="Batch colour grading for photos and video, right in the browser.">
  <meta name="theme-color" content="#0b0a10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Halide">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span id="hlHome"></span>
    <div class="folder"><b id="folderName"></b><span id="folderMeta"></span></div>
    <div class="sp"></div>
    <button class="ib" id="scopesBtn" title="Scopes" aria-label="Scopes" aria-pressed="false"></button>
    <button class="ib" id="openBtn" title="Open" aria-label="Open"></button>
    <button class="ib primary" id="exportBtn" title="Export" aria-label="Export"></button>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="Preview. Hold for the original, pinch to zoom, swipe to browse." hidden></canvas>
    <div class="cropgrid" id="cropGrid" hidden></div>
    <svg class="maskov" id="maskOverlay" hidden></svg>
    <div class="chips" id="chips"></div>
    <button class="navbtn prev" id="prevBtn" aria-label="Previous" hidden>‹</button>
    <button class="navbtn next" id="nextBtn" aria-label="Next" hidden>›</button>
    <p class="stagemsg" id="stageMsg" hidden></p>
    <div class="pscopes" id="scopes" hidden>
      <div class="scope-box"><div class="scope-lbl">Histogram</div><canvas id="scopeHist"></canvas></div>
      <div class="scope-box"><div class="scope-lbl">Waveform</div><canvas id="scopeWave"></canvas></div>
      <div class="scope-box"><div class="scope-lbl">Parade</div><canvas id="scopeParade"></canvas></div>
      <div class="scope-box"><div class="scope-lbl">Vectorscope</div><canvas id="scopeVector"></canvas></div>
    </div>
    <div class="relink" id="relinkBar" hidden><span id="relinkText"></span><button class="btn small primary" id="relinkBtn">Reconnect</button><button class="btn small" id="locateBtn">Locate…</button></div>
    <div class="empty" id="empty">
      <h1>Choose photos and videos</h1>
      <p>Grade the whole series at once, and fine-tune single shots where needed. Everything happens on your device; nothing is uploaded.</p>
      <div class="emptybtns">
        <button class="btn primary" id="resumeBtn" hidden>Continue where you left off</button>
        <button class="btn primary" id="emptyFolder">Open folder…</button>
        <button class="btn" id="emptyFiles">Choose photos and videos…</button>
      </div>
      <p class="hint">You can also drop files or a folder here.</p>
    </div>
    <div class="stagebar" id="stagebar" hidden>
      <button class="iconbtn round" id="playBtn" aria-label="Play"></button>
      <button class="iconbtn round" id="muteBtn" aria-label="Unmute"></button>
      <span class="tc" id="stageTc"></span>
    </div>
  </main>

  <section class="strip">
    <div class="reel" id="reel"></div>
  </section>

  <button class="iconbtn reopen" id="sheetOpen" aria-label="Show panel" hidden><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <nav class="toolbar" id="toolbar" aria-label="Tools">
    <button data-tab="looks"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg>Looks</button>
    <button data-tab="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
    <button data-tab="color"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Color</button>
    <button data-tab="curves"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 21C9 21 9 3 21 3"/></svg>Curves</button>
    <button data-tab="fx"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 9l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>Effects</button>
    <button data-tab="crop"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>Crop</button>
    <button data-tab="trim" class="vid" hidden><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg>Video</button>
  </nav>

  <aside class="panel" id="panel">
    <div class="sheethead" id="sheethead"><button class="iconbtn" id="sheetDone" aria-label="Hide panel"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><b id="sheetTitle">Looks</b></div>
    <div class="scope">
      <div class="seg" role="group" aria-label="What the changes apply to">
        <button data-scope="all" class="on" id="scopeAll">All items</button>
        <button data-scope="item" id="scopeItem">This item only</button>
      </div>
      <div class="scopenote" id="scopeNote"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="looks" class="on">Looks</button>
      <button data-tab="light">Light</button>
      <button data-tab="color">Color</button>
      <button data-tab="curves">Curves</button>
      <button data-tab="fx">Effects</button>
      <button data-tab="crop">Crop</button>
      <button data-tab="trim" class="vid" hidden>Video</button>
    </nav>
    <div class="body" id="body"></div>
  </aside>
</div>

<div class="menu" id="openMenu" hidden></div>
<div class="scrim" id="exportScrim" hidden><div class="sheet" id="exportSheet" role="dialog" aria-label="Export"></div></div>
<div class="dropzone" aria-hidden="true">Drop to add</div>
<script type="module" src="/src/process/main.ts"></script>
</body>
</html>
